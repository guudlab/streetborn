name: Deploy Supabase

# Applies new migrations and deploys the Edge Functions to the hosted project.
# Needs the repository secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and
# SUPABASE_PROJECT_ID (Settings → Secrets and variables → Actions).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'packages/economy/**'
      - 'packages/engine/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check secrets
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase/scripts/ci-run.sh "Link project" supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: supabase/scripts/ci-run.sh "Apply migrations" supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Vendor shared packages
        run: supabase/scripts/vendor-packages.sh
      - name: Deploy functions
        run: supabase/scripts/ci-run.sh "Deploy functions" supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api
