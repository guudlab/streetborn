name: Build unsigned iOS IPA (sideload)

# Builds an UNSIGNED StreetBorn.ipa on a macOS runner so it can be signed with a
# free Apple ID using Sideloadly or AltStore on Windows. No Apple Developer
# account or secrets needed. Run it by hand: Actions > this workflow > Run workflow.
# macOS minutes bill at 10x on private repos, so there is no automatic trigger.
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # app.json sets the web baseUrl to /streetborn, which would make Metro copy
      # assets into STREETBORN.app/streetborn/. macOS is case-insensitive, so that
      # path collides with the STREETBORN executable (ENOTDIR). Native needs no baseUrl.
      EXPO_BASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle the 3D match for the WebView
        run: npm run build:match-webview --workspace apps/mobile
      - name: Generate the native iOS project (not committed)
        working-directory: apps/mobile
        run: npx expo prebuild -p ios
      - name: Let the RevenueCat Test Store run in this test build
        # RevenueCat closes a Release build that is configured with a Test Store key
        # (test_…), so that a test key never reaches the App Store. This IPA is only
        # sideloaded for testing, so its RevenueCat pods are compiled with DEBUG, which
        # is how RevenueCat tells a test build apart. App Store builds never run this.
        working-directory: apps/mobile/ios
        run: |
          ruby -i -pe 'if $_ =~ /^\s*post_install do \|installer\|/ then $_ += <<~RUBY
                installer.pods_project.targets.each do |t|
                  next unless %w[RevenueCat PurchasesHybridCommon].include?(t.name)
                  t.build_configurations.each { |c| c.build_settings["SWIFT_ACTIVE_COMPILATION_CONDITIONS"] = "$(inherited) DEBUG" }
                end
              RUBY
            end' Podfile
          grep -q 'PurchasesHybridCommon].include' Podfile || { echo "::error::Podfile has no post_install block to patch"; exit 1; }
          pod install
      - name: Build Release without code signing
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package StreetBorn.ipa
        working-directory: apps/mobile/ios
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry StreetBorn.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: StreetBorn-unsigned-ipa
          path: apps/mobile/ios/StreetBorn.ipa
          retention-days: 7
