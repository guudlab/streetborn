name: Close mahalle day

# Settles yesterday's mahalle matches (bonuses, respect, results) just after
# midnight Turkey time (UTC+3, no daylight saving). Safe to run again.
# Needs the repository secrets SUPABASE_PROJECT_ID and SUPABASE_SERVICE_ROLE_KEY.
on:
  schedule:
    - cron: '5 21 * * *'
    - cron: '35 21 * * *'
  workflow_dispatch:

jobs:
  close:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Settle ended days
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing repository secret SUPABASE_PROJECT_ID or SUPABASE_SERVICE_ROLE_KEY"; exit 1
          fi
          code=$(curl -s -o out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' -d '{}' \
            "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/mahalle-close")
          cat out.json; echo
          [ "$code" = "200" ] || { echo "::error::mahalle-close answered $code"; exit 1; }
