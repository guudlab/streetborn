name: Deploy web app to GitHub Pages

# Publishes the Expo web build (installable as a PWA) to
# https://kaanayyildiz.github.io/streetborn/ on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export the web build under /streetborn/
        working-directory: apps/mobile
        env:
          EXPO_BASE_URL: /streetborn
          EXPO_PUBLIC_SUPABASE_URL: https://daunbydsmydsvcwemnwx.supabase.co
        run: npx expo export -p web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
