# Netlify builds the Expo web app from GitHub on every push to main,
# plus a preview for each pull request.
# The site's base directory is apps/mobile, so this file lives here and
# every path below is relative to it.
[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  EXPO_BASE_URL = ""

# Single-page app: every path loads index.html and the router takes over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
