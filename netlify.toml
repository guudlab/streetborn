# Netlify builds the Expo web app from GitHub on every push to main,
# plus a preview for each pull request.
[build]
  command = "npm run build:web --workspace apps/mobile"
  publish = "apps/mobile/dist"

[build.environment]
  NODE_VERSION = "22"
  EXPO_BASE_URL = ""

# Single-page app: every path loads index.html and the router takes over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
